<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catering Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --paper: #FAF9F6; --ink: #171512; --pine: #2E4B43; --pine-light: #E7EEEC;
            --bronze: #8A6E4B; --bronze-light: #F1EAE0; --brick: #B23A2E; --brick-light: #F7E7E4;
            --hairline: #E5E1D8; --muted: #8A857C;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: #DCDAD3; font-family: 'Inter', sans-serif; color: var(--ink); min-height: 100vh; padding: 36px 20px; }
        .shell { max-width: 920px; margin: 0 auto; }
        #authGate { position: fixed; inset: 0; background: #DCDAD3; display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .gate-card { background: var(--paper); border: 1px solid var(--hairline); border-radius: 14px; padding: 32px 28px; width: 100%; max-width: 320px; text-align: center; }
        .gate-card h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 22px; margin: 0 0 6px; }
        .gate-card p { font-size: 13px; color: var(--muted); margin: 0 0 18px; }
        .gate-card input { width: 100%; text-align: center; margin-bottom: 10px; border: 1px solid var(--hairline); padding: 10px; border-radius: 8px; }
        .gate-error { font-size: 12.5px; color: var(--brick); min-height: 16px; margin-bottom: 6px; }
        #appShell { display: none; }
        header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 14px; }
        header h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 34px; letter-spacing: -0.01em; margin: 0; }
        .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 12px; }
        .tabs { display: flex; gap: 4px; background: #EFEDE7; border-radius: 10px; padding: 4px; }
        .tab { border: none; background: none; padding: 9px 16px; border-radius: 7px; font-size: 13.5px; font-weight: 500; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .tab.active { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
        .tab .count { background: var(--brick); color: #fff; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 20px; }
        .tab.active .count { background: var(--pine); }
        .btn { border: none; border-radius: 8px; padding: 10px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: background 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--pine); color: #fff; }
        .btn-primary:hover { background: #243D37; }
        .btn-reject { background: none; color: var(--brick); border: 1px solid #E3B7AF; }
        .btn-delete { background: none; color: var(--brick); border: 1px solid #E3B7AF; padding: 7px 12px; font-size: 12.5px; }
        .btn-save { background: var(--bronze); color: #fff; padding: 7px 12px; font-size: 12.5px; }
        .btn:disabled { opacity: 0.5; cursor: default; }
        section { display: none; margin-top: 20px; }
        section.active { display: block; }
        .card { background: var(--paper); border: 1px solid var(--hairline); border-radius: 12px; padding: 18px; margin-bottom: 12px; }
        .req-card { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
        .req-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; margin: 0 0 4px; }
        .req-meta { font-size: 12.5px; color: var(--bronze); margin: 0; }
        .event-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
        .event-date-chip { background: var(--pine-light); color: var(--pine); font-size: 12px; font-weight: 600; padding: 7px 10px; border-radius: 8px; text-align: center; min-width: 70px; }
        .status-pill { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px; margin-top: 4px; display: inline-block; }
        .status-open { background: var(--pine-light); color: var(--pine); }
        .status-closed { background: var(--hairline); color: var(--muted); }
        .config-key { font-size: 13px; font-weight: 600; color: var(--pine); margin: 0 0 8px; font-family: monospace; }
        .config-value-row { display: flex; gap: 10px; align-items: flex-start; }
        textarea, input, select { width: 100%; border: 1px solid var(--hairline); border-radius: 7px; padding: 9px 10px; font-family: inherit; font-size: 13.5px; }
        textarea { font-family: monospace; font-size: 12.5px; }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 11px 18px; border-radius: 9px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 2000; }
        .toast.show { opacity: 1; }
        .add-form { background: var(--paper); border: 1px solid var(--hairline); border-radius: 12px; padding: 18px; margin-bottom: 18px; display: none; }
        .add-form.open { display: block; }
        .form-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; margin-bottom: 12px; align-items: end; }
        .banner-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        label { display: block; font-size: 11.5px; font-weight: 600; color: var(--bronze); margin-bottom: 5px; }
        .banner-card { display: flex; gap: 20px; align-items: flex-start; }
        .banner-img-preview { width: 140px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid var(--hairline); background: #eee; flex-shrink: 0; }
        .banner-fields { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .banner-full-row { grid-column: span 2; }
    </style>
</head>
<body>

<div id="authGate">
    <div class="gate-card">
        <h2>Admin Sign In</h2>
        <p>Enter your credentials to manage Catering.</p>
        <input type="email" id="gateEmail" placeholder="Email" autocomplete="username">
        <input type="password" id="gatePassword" placeholder="Password" autocomplete="current-password">
        <div class="gate-error" id="gateError"></div>
        <button class="btn btn-primary" id="gateSubmit" style="width:100%; justify-content: center;">Sign In</button>
    </div>
</div>

<div class="shell" id="appShell">
    <div class="topbar">
        <span id="whoami" style="font-size: 12px; color: var(--muted)"></span>
        <button class="btn" id="lockBtn" style="font-size: 12px; padding: 4px 8px;">Sign Out</button>
    </div>

    <header>
        <div>
            <h1>Admin Panel<span id="roleSuffix"></span></h1>
            <p style="color: var(--muted); margin: 4px 0 0;">Review requests and manage events</p>
        </div>
        <div class="tabs" id="tabs">
            <button class="tab active" data-tab="requests" id="tabRequests">
                Requests <span class="count" id="countPending">0</span>
            </button>
            <button class="tab" data-tab="events" id="tabEvents">
                Events <span class="count" id="countEvents">0</span>
            </button>
            <button class="tab" data-tab="banners" id="tabBanners">Banners</button>
            <button class="tab" data-tab="users" id="tabUsers">Users</button>
            <button class="tab" data-tab="config" id="tabConfig">Config</button>
        </div>
    </header>

    <div id="noAccess" style="display:none; text-align:center; padding:40px;">
        <h2 style="font-family:Fraunces, serif">No Access</h2>
        <p style="color:var(--muted)">Your account doesn't have Operator or Maintainer permissions.</p>
    </div>

    <section id="section-requests" class="active">
        <div id="requestsList"></div>
    </section>

    <section id="section-events">
        <div style="display:flex; justify-content:space-between; margin-bottom:16px; align-items:center;">
            <h2 style="font-family:Fraunces, serif; margin:0; font-size:20px;">All Events</h2>
            <button class="btn btn-primary" id="toggleAddForm">+ Add Event</button>
        </div>
        <div class="add-form" id="addForm">
            <div class="form-grid">
                <div><label>Name</label><input id="fName" type="text"></div>
                <div><label>Date</label><input id="fDate" type="date"></div>
                <div style="display:flex; align-items:center; gap:8px; padding-bottom:10px;">
                    <input id="fAvailable" type="checkbox" checked> <label style="margin:0">Available</label>
                </div>
            </div>
            <div style="display:flex; gap:8px; justify-content:flex-end;">
                <button class="btn" onclick="document.getElementById('addForm').classList.remove('open')">Cancel</button>
                <button class="btn btn-primary" id="saveAdd">Save Event</button>
            </div>
        </div>
        <div id="eventsList"></div>
    </section>

    <section id="section-banners">
        <div style="display:flex; justify-content:space-between; margin-bottom:16px; align-items:center;">
            <h2 style="font-family:Fraunces, serif; margin:0; font-size:20px;">Banners</h2>
            <button class="btn btn-primary" id="toggleAddBannerForm">+ Add Banner</button>
        </div>
        <div class="add-form" id="addBannerForm">
            <div class="banner-form-grid">
                <div class="banner-full-row"><label>Description</label><input id="bDesc" type="text"></div>
                <div><label>Image File</label><input id="bFile" type="file" accept="image/*"></div>
                <div><label>Linked Event</label><select id="bEidSelect"></select></div>
                <div><label>Version</label><input id="bVer" type="number" value="1"></div>
            </div>
            <div style="display:flex; gap:8px; justify-content:flex-end;">
                <button class="btn" onclick="document.getElementById('addBannerForm').classList.remove('open')">Cancel</button>
                <button class="btn btn-primary" id="saveAddBanner">Upload & Save Banner</button>
            </div>
        </div>
        <div id="bannersList"></div>
    </section>

    <section id="section-users">
        <div style="display:flex; justify-content:space-between; margin-bottom:16px; align-items:center;">
            <h2 style="font-family:Fraunces, serif; margin:0; font-size:20px;">Users</h2>
        </div>
        <div id="usersLoading" class="loading" style="display:none;">Loading users…</div>
        <div id="usersList"></div>
    </section>

    <section id="section-config">
        <div style="display:flex; justify-content:space-between; margin-bottom:16px; align-items:center;">
            <h2 style="font-family:Fraunces, serif; margin:0; font-size:20px;">Remote Config</h2>
            <button class="btn btn-primary" id="toggleAddConfigForm">+ Add Key</button>
        </div>
        <div class="add-form" id="addConfigForm">
            <div style="display:grid; grid-template-columns: 1fr 2fr; gap:12px; margin-bottom:12px;">
                <div><label>Key Name</label><input id="cKey" type="text" placeholder="rc_feature_enabled"></div>
                <div><label>Initial Value</label><input id="cVal" type="text"></div>
            </div>
            <div style="display:flex; gap:8px; justify-content:flex-end;">
                <button class="btn" onclick="document.getElementById('addConfigForm').classList.remove('open')">Cancel</button>
                <button class="btn btn-primary" id="saveAddConfig">Create Key</button>
            </div>
        </div>
        <div id="configLoading" class="loading" style="display:none;">Loading config…</div>
        <div id="configList"></div>
    </section>
</div>

<div class="toast" id="toast"></div>

<script>
    const SUPABASE_URL = "https://naycdjyrbzslperayawc.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_i4r9GEhLBpWBFdLOtyBU8Q_jImE54B4";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let myRoles = [];
    let allEventsCached = [];

    async function init() {
        const { data } = await supabaseClient.auth.getSession();
        if (data.session) {
            showApp(data.session);
        } else {
            showGate();
        }
    }

    async function showApp(session) {
        document.getElementById('whoami').textContent = session.user.email;
        const { data: roles } = await supabaseClient.from('admin_roles').select('role').eq('user_id', session.user.id);
        myRoles = roles ? roles.map(r => r.role) : [];
        document.getElementById('roleSuffix').textContent = myRoles.length ? ' - ' + myRoles.join(', ') : '';

        if (myRoles.length === 0) {
            document.getElementById('noAccess').style.display = 'block';
            document.getElementById('tabs').style.display = 'none';
        } else {
            document.getElementById('authGate').style.display = 'none';
            document.getElementById('appShell').style.display = 'block';
            applyVisibility();
        }
    }

    async function applyVisibility() {
        const isOp = myRoles.includes('operator');
        const isMain = myRoles.includes('maintainer');
        document.getElementById('tabRequests').style.display = isOp ? 'flex' : 'none';
        document.getElementById('tabEvents').style.display = isOp ? 'flex' : 'none';
        document.getElementById('tabBanners').style.display = isOp ? 'flex' : 'none';
        document.getElementById('tabUsers').style.display = isMain ? 'flex' : 'none';
        document.getElementById('tabConfig').style.display = isMain ? 'flex' : 'none';

        if (isOp) {
            loadRequests();
            await loadEvents();
            await loadBanners();
        }
        if (isMain) { loadConfig(); loadUsers(); }
    }

    async function loadUsers() {
        const loadingEl = document.getElementById('usersLoading');
        if (loadingEl) loadingEl.style.display = 'block';

        const { data } = await supabaseClient.from('users').select('*, admin_roles(role)').order('name');
        if (loadingEl) loadingEl.style.display = 'none';

        const list = document.getElementById('usersList');
        list.innerHTML = (data && data.length) ? '' : '<div class="card">No users found</div>';

        if (data) data.forEach(u => {
            const rolesList = (u.admin_roles && u.admin_roles.length)
                ? u.admin_roles.map(r => r.role).join(', ')
                : 'volunteer';

            const div = document.createElement('div');
            div.className = 'card';
            div.style.display = 'flex';
            div.style.justifyContent = 'space-between';
            div.style.alignItems = 'center';
            div.innerHTML = `
                <div>
                    <p style="font-weight:600; margin:0">
                        ${u.name || 'Unnamed User'}
                        <span style="font-weight:500; font-size:11px; color:var(--pine); background:var(--pine-light); padding:2px 8px; border-radius:10px; margin-left:8px; text-transform:uppercase;">
                            ${rolesList}
                        </span>
                    </p>
                    <p style="font-size:12px; color:var(--muted); margin:4px 0 0">${u.id}</p>
                </div>
                <button class="btn btn-delete" onclick="deleteUser('${u.id}', '${u.name}')">Delete</button>`;
            list.appendChild(div);
        });
    }

    async function deleteUser(id, name) {
        if (confirm(`Delete profile for "${name}"? Note: This deletes the public profile but the Auth account will remain until manually removed in Supabase.`)) {
            const { error } = await supabaseClient.from('users').delete().eq('id', id);
            if (error) alert('Error: ' + error.message);
            else {
                showToast('User profile deleted');
                loadUsers();
            }
        }
    }

    async function loadRequests() {
        const { data } = await supabaseClient.from('event_assignments').select('user_id, event_id, users(name), calendar_events(date, name)').eq('status', 'APPLIED');
        document.getElementById('countPending').textContent = data ? data.length : 0;
        const list = document.getElementById('requestsList');
        list.innerHTML = (data && data.length) ? '' : '<div class="card">No pending requests</div>';
        if (data) data.forEach(req => {
            const card = document.createElement('div');
            card.className = 'card req-card';
            card.innerHTML = `<div><p class="req-title">${req.calendar_events.name}</p><p class="req-meta">${req.calendar_events.date} • Requested by ${req.users.name}</p></div>
                <div style="display:flex; gap:8px;"><button class="btn btn-reject" onclick="handleReq('${req.user_id}', ${req.event_id}, 'reject')">Reject</button>
                <button class="btn btn-primary" onclick="handleReq('${req.user_id}', ${req.event_id}, 'approve')">Approve</button></div>`;
            list.appendChild(card);
        });
    }

    async function handleReq(uid, eid, action) {
        if (action === 'approve') await supabaseClient.from('event_assignments').update({ status: 'CONFIRMED' }).eq('user_id', uid).eq('event_id', eid);
        else await supabaseClient.from('event_assignments').delete().eq('user_id', uid).eq('event_id', eid);
        showToast(action === 'approve' ? 'Approved' : 'Rejected');
        loadRequests();
    }

    async function loadEvents() {
        const { data } = await supabaseClient.from('calendar_events').select('*').order('date', { ascending: true });
        allEventsCached = data || [];
        document.getElementById('countEvents').textContent = allEventsCached.length;
        const list = document.getElementById('eventsList');
        list.innerHTML = '';
        allEventsCached.forEach(ev => {
            const d = new Date(ev.date + 'T00:00:00');
            const row = document.createElement('div');
            row.className = 'card event-row';
            row.innerHTML = `<div class="event-date-chip">${d.toLocaleString('en-US', {month:'short'})}<br>${d.getDate()}</div>
                <div style="flex:1"><p style="font-weight:500; margin:0">${ev.name} (ID: ${ev.id})</p><span class="status-pill ${ev.is_available?'status-open':'status-closed'}">${ev.is_available?'Open':'Closed'}</span></div>
                <div style="display:flex; gap:12px; align-items:center;"><label style="font-size:12px; margin:0"><input type="checkbox" ${ev.is_available?'checked':''} onchange="toggleAvail(${ev.id}, this.checked)"> Available</label>
                <button class="btn btn-delete" onclick="deleteEv(${ev.id})">Delete</button></div>`;
            list.appendChild(row);
        });
        updateBannerEventDropdowns();
    }

    function updateBannerEventDropdowns() {
        const html = '<option value="">None</option>' + allEventsCached.map(e => `<option value="${e.id}">${e.name} (${e.date})</option>`).join('');
        document.getElementById('bEidSelect').innerHTML = html;
        document.querySelectorAll('.banner-event-select').forEach(sel => {
            const currentVal = sel.dataset.selected;
            sel.innerHTML = html;
            sel.value = currentVal || "";
        });
    }

    async function toggleAvail(id, val) { await supabaseClient.from('calendar_events').update({ is_available: val }).eq('id', id); loadEvents(); }
    async function deleteEv(id) { if(confirm('Delete event?')) { await supabaseClient.from('calendar_events').delete().eq('id', id); loadEvents(); } }

    async function loadBanners() {
        const { data } = await supabaseClient.from('banners').select('*').order('id', { ascending: false });
        const list = document.getElementById('bannersList');
        list.innerHTML = (data && data.length) ? '' : '<div class="card">No banners yet</div>';

        if (data) data.forEach(b => {
            // Use SDK to get the public URL safely
            const { data: { publicUrl } } = supabaseClient.storage.from('banners').getPublicUrl(b.image_path);

            const div = document.createElement('div');
            div.className = 'card banner-card';
            div.innerHTML = `
                <img src="${publicUrl}" class="banner-img-preview"
                     onerror="console.error('Failed to load image:', '${publicUrl}'); this.src='https://placehold.co/140x80?text=Error';">
                <div class="banner-fields">
                    <div class="banner-full-row"><label>Description</label><input type="text" id="bd-${b.id}" value="${b.description}"></div>
                    <div><label>Image Path (ReadOnly)</label><input type="text" value="${b.image_path}" disabled></div>
                    <div><label>Linked Event</label><select id="be-${b.id}" class="banner-event-select" data-selected="${b.event_id || ""}"></select></div>
                    <div><label>Version</label><input type="number" id="bv-${b.id}" value="${b.version}"></div>
                    <div class="banner-full-row" style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
                        <button class="btn btn-delete" onclick="deleteBanner(${b.id}, '${b.image_path}')">Delete</button>
                        <button class="btn btn-save" onclick="saveBanner(${b.id})">Save Changes</button>
                    </div>
                </div>`;
            list.appendChild(div);
        });
        updateBannerEventDropdowns();
    }

    async function saveBanner(id) {
        const description = document.getElementById('bd-'+id).value;
        const event_id = document.getElementById('be-'+id).value || null;
        const version = parseInt(document.getElementById('bv-'+id).value) || 1;

        await supabaseClient.from('banners').update({ description, event_id, version }).eq('id', id);
        showToast('Banner updated');
        loadBanners();
    }

    async function deleteBanner(id, path) {
        if(confirm('Delete banner? This will also remove the image from storage.')) {
            await supabaseClient.from('banners').delete().eq('id', id);
            await supabaseClient.storage.from('banners').remove([path]);
            showToast('Banner deleted');
            loadBanners();
        }
    }

    async function loadConfig() {
        const loadingEl = document.getElementById('configLoading');
        if (loadingEl) loadingEl.style.display = 'block';

        const { data } = await supabaseClient.from('remote_config').select('*').order('key');
        if (loadingEl) loadingEl.style.display = 'none';

        const list = document.getElementById('configList');
        list.innerHTML = (data && data.length) ? '' : '<div class="card">No config values found</div>';

        if (data) data.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <p class="config-key">${c.key}</p>
                <div class="config-value-row">
                    <textarea id="cfg-${c.key}">${c.value}</textarea>
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <button class="btn btn-save" onclick="saveCfg('${c.key}')">Save</button>
                        <button class="btn btn-delete" style="padding: 4px 8px; font-size: 11px;" onclick="deleteCfg('${c.key}')">Delete</button>
                    </div>
                </div>`;
            list.appendChild(div);
        });
    }

    async function saveCfg(key) {
        const val = document.getElementById('cfg-' + key).value;
        const { error } = await supabaseClient.from('remote_config').update({ value: val }).eq('key', key);
        if (error) alert('Error: ' + error.message);
        else showToast('Saved');
    }

    async function deleteCfg(key) {
        if (confirm(`Delete key "${key}"? This may break the app if it expects this value.`)) {
            const { error } = await supabaseClient.from('remote_config').delete().eq('key', key);
            if (error) alert('Error: ' + error.message);
            else {
                showToast('Deleted');
                loadConfig();
            }
        }
    }

    document.getElementById('toggleAddConfigForm').addEventListener('click', () => document.getElementById('addConfigForm').classList.toggle('open'));

    document.getElementById('saveAddConfig').addEventListener('click', async () => {
        const key = document.getElementById('cKey').value.trim();
        const value = document.getElementById('cVal').value;

        if (!key) { alert('Key name is required'); return; }

        const { error } = await supabaseClient.from('remote_config').insert({ key, value });
        if (error) {
            alert('Error: ' + error.message);
        } else {
            document.getElementById('addConfigForm').classList.remove('open');
            document.getElementById('cKey').value = '';
            document.getElementById('cVal').value = '';
            showToast('Key created');
            loadConfig();
        }
    });

    function showGate() { document.getElementById('authGate').style.display = 'flex'; document.getElementById('appShell').style.display = 'none'; }
    function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }

    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
        document.querySelectorAll('.tab, section').forEach(el => el.classList.remove('active'));
        t.classList.add('active');
        document.getElementById('section-' + t.dataset.tab).classList.add('active');
    }));

    document.getElementById('gateSubmit').addEventListener('click', async () => {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email: gateEmail.value, password: gatePassword.value });
        if (error) document.getElementById('gateError').textContent = error.message;
        else showApp(data.session);
    });

    document.getElementById('lockBtn').addEventListener('click', async () => { await supabaseClient.auth.signOut(); location.reload(); });

    document.getElementById('toggleAddForm').addEventListener('click', () => {
        const form = document.getElementById('addForm');
        form.classList.toggle('open');
        if (form.classList.contains('open')) {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('fDate').value = `${yyyy}-${mm}-${dd}`;
        }
    });

    document.getElementById('saveAdd').addEventListener('click', async () => {
        const name = fName.value;
        const date = fDate.value;
        const is_available = fAvailable.checked;
        if (!name.trim() || !date) { alert('Name and date are required'); return; }
        await supabaseClient.from('calendar_events').insert({ name, date, is_available });
        document.getElementById('addForm').classList.remove('open'); loadEvents();
    });

    document.getElementById('toggleAddBannerForm').addEventListener('click', () => document.getElementById('addBannerForm').classList.toggle('open'));

    document.getElementById('saveAddBanner').addEventListener('click', async () => {
        const description = bDesc.value;
        const event_id = bEidSelect.value || null;
        const version = parseInt(bVer.value) || 1;
        const file = bFile.files[0];

        if (!file) { alert('Please choose an image file'); return; }

        const saveBtn = document.getElementById('saveAddBanner');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Uploading...';

        const fileName = `${Date.now()}_${file.name.replace(/[^a-z0-9.]/gi, '_').toLowerCase()}`;
        const { error: uploadError } = await supabaseClient.storage.from('banners').upload(fileName, file);

        if (uploadError) {
            alert('Upload failed: ' + uploadError.message);
            saveBtn.disabled = false;
            saveBtn.textContent = 'Upload & Save Banner';
            return;
        }

        const { error: dbError } = await supabaseClient.from('banners').insert({
            description,
            image_path: fileName,
            event_id,
            version
        });

        saveBtn.disabled = false;
        saveBtn.textContent = 'Upload & Save Banner';

        if (dbError) {
            alert('DB Save failed: ' + dbError.message);
            return;
        }

        document.getElementById('addBannerForm').classList.remove('open');
        bDesc.value = ''; bFile.value = '';
        showToast('Banner added');
        loadBanners();
    });

    window.onload = init;
</script>
</body>
</html>
